[package]
name = "zxcide-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zxcide"
path = "src/main.rs"

[features]
default = ["merge-simd"]
merge-simd = ["zxcide/merge-simd"]
tracy = ["zxcide/tracy", "zxcide-seek/tracy", "zxcide-parallel/tracy", "dep:tracy-client"]
flume = ["zxcide-parallel/flume"]
kanal = ["zxcide-parallel/kanal"]
crossfire = ["zxcide-parallel/crossfire"]
rayon = ["zxcide-parallel/rayon"]
transports = ["flume", "kanal", "crossfire", "rayon"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tracy-client = { workspace = true, optional = true }
zxcide = { path = "../codec" }
zxcide-seek = { path = "../seek" }
zxcide-parallel = { path = "../parallel" }
