[workspace]
members = ["crates/codec", "crates/cli", "crates/component", "xtask"]
default-members = ["crates/codec", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

[workspace.dependencies]
tracy-client = { version = "0.19", default-features = false, features = ["enable", "ondemand", "only-localhost"] }

[profile.profiling]
inherits = "release"
debug = 1
strip = false
