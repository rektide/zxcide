name: Codec checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.245.1
      - run: cargo clippy --locked -p zxc-component --target wasm32-unknown-unknown -- -D warnings
      - name: Exercise the release component through its WIT API
        run: ZXC_BENCH_MODE=all cargo xtask bench component -- --test
      - uses: actions/upload-artifact@v4
        with:
          name: zxc-codec-component
          path: target/component/
          if-no-files-found: error
  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: sha256sum --quiet -c tests/conformance/v9/vectors.sha256
      - run: cargo fmt --all --check && cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.122
      - run: |
          cargo nextest run --locked --workspace
          cargo test --doc --locked --workspace
          cargo nextest run --locked --all-features
          cargo test --doc --locked --all-features
      - name: Exercise all benchmark cases once
        run: ZXC_BENCH_MODE=all cargo xtask bench native -- --test
      - uses: actions/checkout@v4
        with:
          repository: hellobertrand/zxc
          ref: 2992c28e6e1df07feec0cb39678a6d4a9665c6bb
          path: .test-agent/oracle/zxc
      - run: |
          cmake -S .test-agent/oracle/zxc -B .test-agent/oracle/build -DCMAKE_BUILD_TYPE=Release -DZXC_BUILD_TESTS=OFF
          cmake --build .test-agent/oracle/build --parallel 2
          cargo build --locked --release -p zxc-cli
          cargo xtask interop .test-agent/oracle/build/zxc target/release/zxc
