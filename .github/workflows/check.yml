name: Codec checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.245.1
      - run: cargo clippy --locked -p zxc-component --target wasm32-unknown-unknown -- -D warnings
      - name: Exercise all release variants through the same WIT API
        run: |
          for variant in scalar simd128 relaxed-simd; do
            ZXC_BENCH_MODE=all cargo xtask bench component --variant "$variant" -- --test
          done
          (cd target/component && sha256sum *.wasm > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: zxc-codec-component
          path: target/component/
          if-no-files-found: error
  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: sha256sum --quiet -c tests/conformance/v9/vectors.sha256
      - run: cargo fmt --all --check && cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.122
      - run: |
          cargo nextest run --locked --workspace
          cargo test --doc --locked --workspace
          cargo nextest run --locked --all-features
          cargo test --doc --locked --all-features
      - name: Exercise all benchmark cases once
        run: ZXC_BENCH_MODE=all cargo xtask bench native -- --test
      - name: Cross-check with the pinned upstream C binary
        run: cargo xtask interop
      - name: Check generated archives with each parallel backend
        run: |
          for backend in crossbeam flume kanal crossfire rayon; do
            cargo xtask interop --parallel-backend "$backend"
          done
      - name: Preserve generated-case reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-interop-failures
          path: target/generated-interop-*/
          if-no-files-found: ignore
  codec-linux-qemu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - target: riscv64gc-unknown-linux-gnu
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
    steps:
      - uses: actions/checkout@v4
      - name: Install the cross toolchain and QEMU user-mode
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user ${{ matrix.packages }}
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}
      - run: scripts/test-linux-qemu.sh ${{ matrix.target }}
